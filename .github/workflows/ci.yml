name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    name: Test and package (macOS 26, arm64)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -m
      - name: Validate metadata and scripts
        run: |
          plutil -lint Resources/Info.plist
          bash -n scripts/build.sh scripts/package.sh
          python3 -m py_compile scripts/update_solar_terms.py
      - name: Run tests
        run: swift test
      - name: Build and package release app
        run: ./scripts/package.sh
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SuiXu-macos-arm64-${{ github.sha }}
          path: |
            dist/SuiXu-*-macos-arm64.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
